<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Latihan Web02</title>

    <style>
        .form-container {
            width: 380px;
            height: 240px;
            border: 3px solid gray;
            padding: 15px;
            overflow: auto;
            box-sizing: border-box;
            overflow-y: scroll;
            overflow-x: hidden;
        }
          .form-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 7px;
        }

        .form-row label {
            width: 60px;
            flex-shrink: 0;
        }

        .form-row input {
            width: 245px;
            height: 21px;
            box-sizing: border-box;
        }

        .form-row textarea {
            width: 210px;
            height: 80px;
            box-sizing: border-box;
            overflow-y: scroll;
            overflow-x: hidden;
            text-align: left;
        }
         .form-row:last-child input {
            width: 145px;
        }

    </style>
</head>

<body>
    <div class="form-container">
    <form>
        <div class="form-row">
        <label>Name:</label>
        <input type="text" placeholder="sesilia ina pratiwi">
        </div>

        <div class="form-row">
        <label>Email:</label>
        <input type="email" placeholder="sesiliaina181@gmail.com">
        </div>

        <div class="form-row">
        <label>Address:</label>
        <textarea input type="address" placeholder="Sambirejo"></textarea>
        </div>

        <div class="form-row">   
        <label>Postcode:</label>
        <input type="text" placeholder="postal code">
        </div>

    </form>
    </div>

</body>

</html>
