<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
</head>

<body>

    <h1 id="display">00 : 00 : 00 : 000</h1>

    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

    <script>

        // Menyimpan waktu dalam milidetik
        let waktu = 0;

        // Menyimpan timer
        let timer = null;

        // Mengambil elemen display
        let display = document.getElementById("display");


        // =========================
        // FUNCTION START
        // =========================

        function start() {

            // Jika stopwatch sudah berjalan,
            // jangan membuat timer baru
            if (timer) {
                return;
            }

            timer = setInterval(function() {

                // Tambahkan 10 milidetik
                waktu += 10;

                // Hitung jam
                let jam = Math.floor(waktu / 3600000);

                // Hitung menit
                let menit = Math.floor((waktu % 3600000) / 60000);

                // Hitung detik
                let detik = Math.floor((waktu % 60000) / 1000);

                // Hitung milidetik
                let milidetik = waktu % 1000;


                // Menampilkan waktu
                display.textContent =
                    String(jam).padStart(2, "0") + " : " +
                    String(menit).padStart(2, "0") + " : " +
                    String(detik).padStart(2, "0") + " : " +
                    String(milidetik).padStart(3, "0");

            }, 10);

        }


        // =========================
        // FUNCTION STOP
        // =========================

        function stop() {

            clearInterval(timer);

            timer = null;

        }


        // =========================
        // FUNCTION RESET
        // =========================

        function reset() {

            clearInterval(timer);

            timer = null;

            waktu = 0;

            display.textContent = "00 : 00 : 00 : 000";

        }

    </script>

</body>

</html>
