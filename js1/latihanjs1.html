<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator JavaScript</title>
</head>

<body>

    <script>

        while (true) {

            let angka1 = prompt("Masukkan angka pertama:");

            // Jika klik Cancel, kembali ke awal
            if (angka1 === null) {
                continue;
            }

            angka1 = Number(angka1);

            let operator = prompt("Masukkan operator (+, -, *, /):");

            // Jika klik Cancel, kembali ke awal
            if (operator === null) {
                continue;
            }

            let angka2 = prompt("Masukkan angka kedua:");

            // Jika klik Cancel, kembali ke awal
            if (angka2 === null) {
                continue;
            }

            angka2 = Number(angka2);

            let hasil;

            if (operator == "+") {
                hasil = angka1 + angka2;
            }
            else if (operator == "-") {
                hasil = angka1 - angka2;
            }
            else if (operator == "*") {
                hasil = angka1 * angka2;
            }
            else if (operator == "/") {
                hasil = angka1 / angka2;
            }
            else {
                hasil = "Operator tidak valid";
            }

            alert("Hasil: " + hasil);
        }

    </script>

</body>

</html>
